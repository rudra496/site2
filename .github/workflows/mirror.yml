name: Mirror to Backup Org
on:
  push:
    branches: ['**']
  delete:
    branches: ['**']
  create:
    ref_type: branch
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          if [ -n "${{ secrets.MIRROR_TOKEN }}" ]; then
            git remote add backup https://rudra496:${{ secrets.MIRROR_TOKEN }}@github.com/rudrasarker125/${{ github.event.repository.name }}.git 2>/dev/null || true
            git push backup --mirror --force || echo "Backup repository not accessible or not created yet."
          else
            echo "MIRROR_TOKEN not configured, skipping mirror."
          fi
        continue-on-error: true
